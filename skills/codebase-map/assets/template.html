<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Codebase map</title>
    <style>
      :root {
        --ink: #191914;
        --muted: #686555;
        --paper: #d8d0a6;
        --paper-2: #cbc293;
        --paper-3: #ede7ca;
        --line: rgba(25, 25, 20, 0.72);
        --faint: rgba(25, 25, 20, 0.16);
        --selected: #f6f0d4;
        --shadow: rgba(25, 25, 20, 0.18);
        --mono:
          "SFMono-Regular", "Cascadia Code", "Roboto Mono", Menlo, Consolas,
          monospace;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        overflow: hidden;
        color: var(--ink);
        background: var(--paper);
        font-family: var(--mono);
        font-size: 13px;
      }

      button {
        color: inherit;
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 0;
        font: inherit;
        cursor: pointer;
      }

      button:hover,
      button:focus-visible {
        background: var(--selected);
      }
      button:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: -3px;
      }

      .shell {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        height: 100%;
      }

      .topbar {
        min-height: 54px;
        display: grid;
        grid-template-columns: minmax(260px, 1.7fr) repeat(
            4,
            minmax(110px, 0.7fr)
          ) auto;
        border-bottom: 1px solid var(--line);
        background: var(--paper-2);
      }

      .topbar > * {
        min-width: 0;
        padding: 8px 12px;
        border-right: 1px solid var(--faint);
      }

      .eyebrow {
        margin-bottom: 5px;
        color: var(--muted);
        font-size: 10px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .brand-value,
      .stat-value {
        overflow: hidden;
        font-size: 14px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .top-controls {
        display: flex;
        gap: 7px;
        align-items: center;
        justify-content: flex-end;
        border-right: 0;
      }

      .top-controls button {
        padding: 8px 11px;
        white-space: nowrap;
      }

      .workspace {
        min-height: 0;
        display: grid;
        grid-template-columns: 214px minmax(360px, 1fr) 360px;
      }

      .rail,
      .inspector {
        min-height: 0;
        overflow: auto;
        background: color-mix(in srgb, var(--paper) 88%, white 12%);
      }

      .rail {
        border-right: 1px solid var(--line);
      }
      .inspector {
        border-left: 1px solid var(--line);
      }

      .section-label {
        padding: 14px 12px 8px;
        color: var(--muted);
        font-size: 10px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .rail-list {
        display: grid;
        gap: 5px;
        padding: 0 10px 10px;
      }

      .rail-item {
        width: 100%;
        padding: 9px 10px;
        text-align: left;
      }

      .rail-item strong {
        display: block;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
      }
      .rail-item span {
        display: block;
        margin-top: 4px;
        color: var(--muted);
        font-size: 10px;
        line-height: 1.35;
      }
      .rail-item.active {
        background: var(--ink);
        color: var(--paper-3);
      }
      .rail-item.active span {
        color: var(--paper);
      }

      .legend {
        margin: 4px 10px 16px;
        padding: 10px;
        border: 1px solid var(--faint);
        color: var(--muted);
        font-size: 10px;
        line-height: 1.55;
      }

      .legend-row {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .legend-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--ink);
      }
      .legend-line {
        width: 18px;
        height: 1px;
        background: var(--ink);
      }

      .stage {
        position: relative;
        min-height: 0;
        overflow: hidden;
        background: var(--paper);
      }

      #map {
        display: block;
        width: 100%;
        height: 100%;
        cursor: grab;
        touch-action: none;
        user-select: none;
      }

      #map.dragging {
        cursor: grabbing;
      }

      .map-controls {
        position: absolute;
        z-index: 4;
        top: 12px;
        right: 12px;
        display: grid;
        gap: 5px;
      }

      .map-controls button {
        width: 34px;
        height: 30px;
        background: var(--paper-3);
        font-size: 16px;
      }

      .map-hint {
        position: absolute;
        z-index: 3;
        right: 14px;
        bottom: 10px;
        left: 14px;
        color: var(--muted);
        font-size: 10px;
        letter-spacing: 0.07em;
        pointer-events: none;
      }

      .group-boundary {
        fill: rgba(255, 255, 255, 0.06);
        stroke: var(--faint);
        stroke-dasharray: 6 5;
      }

      .group-label {
        fill: var(--muted);
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .edge-visible {
        fill: none;
        stroke-width: 1.8;
        opacity: 0.82;
        vector-effect: non-scaling-stroke;
      }

      .edge-hit {
        fill: none;
        stroke: transparent;
        stroke-width: 18;
        cursor: pointer;
        vector-effect: non-scaling-stroke;
      }

      .edge-label-bg {
        fill: var(--paper-3);
        stroke: var(--faint);
      }
      .edge-label {
        fill: var(--ink);
        font-size: 10px;
        pointer-events: none;
      }
      .edge-group.selected .edge-visible {
        stroke-width: 3.2;
        opacity: 1;
      }

      .node {
        cursor: pointer;
        outline: none;
      }
      .node .front {
        fill: var(--paper-3);
        stroke: var(--ink);
        stroke-width: 1.3;
      }
      .node .top-face {
        fill: color-mix(in srgb, var(--node-color) 30%, var(--paper-3));
        stroke: var(--ink);
        stroke-width: 1.1;
      }
      .node .side-face {
        fill: color-mix(in srgb, var(--node-color) 48%, var(--paper-2));
        stroke: var(--ink);
        stroke-width: 1.1;
      }
      .node .kind-bar {
        fill: var(--node-color);
      }
      .node:hover .front,
      .node:focus-visible .front {
        fill: white;
      }
      .node.selected .front {
        fill: var(--selected);
        stroke-width: 2.7;
      }
      .node-title {
        fill: var(--ink);
        font-size: 12px;
        font-weight: 650;
        pointer-events: none;
      }
      .node-meta {
        fill: var(--muted);
        font-size: 9px;
        pointer-events: none;
      }
      .node-short {
        fill: var(--ink);
        font-size: 9px;
        font-weight: 700;
        pointer-events: none;
      }

      .particle {
        stroke: var(--paper-3);
        stroke-width: 1.3;
        cursor: pointer;
        vector-effect: non-scaling-stroke;
      }

      .tooltip {
        position: fixed;
        z-index: 20;
        max-width: 320px;
        padding: 8px 10px;
        border: 1px solid var(--ink);
        background: var(--ink);
        color: var(--paper-3);
        font-size: 10px;
        line-height: 1.45;
        pointer-events: none;
        opacity: 0;
        transform: translate(10px, 10px);
        transition: opacity 80ms linear;
      }

      .tooltip.visible {
        opacity: 1;
      }

      .inspector-tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        position: sticky;
        top: 0;
        z-index: 2;
      }
      .inspector-tabs button {
        padding: 11px 8px;
        border-width: 0 0 1px 1px;
        background: var(--paper-2);
        font-size: 10px;
        letter-spacing: 0.11em;
        text-transform: uppercase;
      }
      .inspector-tabs button:first-child {
        border-left: 0;
      }
      .inspector-tabs button.active {
        color: var(--paper-3);
        background: var(--ink);
      }

      .inspector-body {
        padding: 18px;
      }
      .inspector-kicker {
        color: var(--muted);
        font-size: 10px;
        letter-spacing: 0.17em;
        text-transform: uppercase;
      }
      .inspector-title {
        margin: 9px 0 7px;
        font-size: 21px;
        font-weight: 500;
        line-height: 1.15;
      }
      .inspector-subtitle {
        margin: 0 0 20px;
        color: var(--muted);
        line-height: 1.45;
      }
      .detail-section {
        margin-top: 20px;
        padding-top: 12px;
        border-top: 1px solid var(--line);
      }
      .detail-section h3 {
        margin: 0 0 9px;
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      .detail-section p,
      .detail-section li {
        line-height: 1.55;
      }
      .detail-section ul {
        margin: 0;
        padding-left: 18px;
      }
      .source-ref {
        display: block;
        width: 100%;
        margin-top: 7px;
        padding: 8px;
        overflow: hidden;
        background: var(--paper-3);
        text-align: left;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .pill-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .pill {
        padding: 4px 7px;
        border: 1px solid var(--faint);
        background: rgba(255, 255, 255, 0.12);
        font-size: 9px;
        text-transform: uppercase;
      }
      .payload {
        padding: 10px;
        border-left: 3px solid var(--ink);
        background: var(--paper-3);
        line-height: 1.5;
        overflow-wrap: anywhere;
      }

      @media (max-width: 1100px) {
        .topbar {
          grid-template-columns: minmax(240px, 1.5fr) repeat(
              2,
              minmax(100px, 0.6fr)
            ) auto;
        }
        .topbar .optional-stat {
          display: none;
        }
        .workspace {
          grid-template-columns: 170px minmax(360px, 1fr) 310px;
        }
      }

      @media (max-width: 780px) {
        body {
          overflow: auto;
        }
        .shell {
          height: auto;
          min-height: 100%;
        }
        .topbar {
          grid-template-columns: 1fr auto;
        }
        .topbar .stat {
          display: none;
        }
        .workspace {
          grid-template-columns: 1fr;
          grid-template-rows: auto 62vh auto;
        }
        .rail {
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
        .rail .section-label,
        .legend {
          display: none;
        }
        .rail-list {
          display: flex;
          overflow-x: auto;
          padding: 8px;
        }
        .rail-item {
          min-width: 150px;
        }
        .inspector {
          border-top: 1px solid var(--line);
          border-left: 0;
        }
        .stage {
          min-height: 480px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .particle {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div>
          <div class="eyebrow">Repository</div>
          <div class="brand-value" id="repository-name"></div>
        </div>
        <div class="stat">
          <div class="eyebrow" id="stat-label-0"></div>
          <div class="stat-value" id="stat-value-0"></div>
        </div>
        <div class="stat">
          <div class="eyebrow" id="stat-label-1"></div>
          <div class="stat-value" id="stat-value-1"></div>
        </div>
        <div class="stat optional-stat">
          <div class="eyebrow" id="stat-label-2"></div>
          <div class="stat-value" id="stat-value-2"></div>
        </div>
        <div class="stat optional-stat">
          <div class="eyebrow" id="stat-label-3"></div>
          <div class="stat-value" id="stat-value-3"></div>
        </div>
        <div class="top-controls">
          <button type="button" id="play-button">❚❚ Pause flow</button>
          <button type="button" id="step-button">Trace one step</button>
          <button type="button" id="reset-button">Reset view</button>
        </div>
      </header>

      <main class="workspace">
        <nav class="rail" aria-label="Diagram navigation">
          <div class="section-label">System boundaries</div>
          <div class="rail-list" id="group-list"></div>
          <div class="section-label">Runtime flows</div>
          <div class="rail-list" id="flow-list"></div>
          <div class="legend">
            <div class="legend-row">
              <span class="legend-dot"></span> animated payload
            </div>
            <div class="legend-row">
              <span class="legend-line"></span> directed transition
            </div>
            <div>Click a node, edge, or particle to inspect evidence.</div>
          </div>
        </nav>

        <section class="stage" aria-label="Interactive codebase diagram">
          <div class="map-controls" aria-label="Map controls">
            <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
            <button type="button" id="zoom-out" aria-label="Zoom out">−</button>
          </div>
          <svg id="map" role="img" aria-labelledby="map-title map-description">
            <title id="map-title"></title>
            <desc id="map-description"></desc>
            <defs id="map-defs">
              <pattern
                id="grid"
                width="44"
                height="44"
                patternUnits="userSpaceOnUse"
              >
                <path
                  d="M 44 0 L 0 0 0 44"
                  fill="none"
                  stroke="rgba(25,25,20,.1)"
                  stroke-width="1"
                />
              </pattern>
            </defs>
            <g id="viewport">
              <rect id="grid-background" x="0" y="0" fill="url(#grid)"></rect>
              <g id="groups-layer"></g>
              <g id="edges-layer"></g>
              <g id="nodes-layer"></g>
              <g id="particles-layer"></g>
            </g>
          </svg>
          <div class="map-hint">
            DRAG TO PAN · SCROLL TO ZOOM · CLICK TO INSPECT · MOVING DOTS ARE
            PAYLOADS
          </div>
        </section>

        <aside class="inspector" aria-label="Selection details">
          <div class="inspector-tabs">
            <button type="button" class="active" data-tab="what">
              What it does
            </button>
            <button type="button" data-tab="build">How it's built</button>
          </div>
          <div class="inspector-body" id="inspector-body"></div>
        </aside>
      </main>
    </div>

    <div class="tooltip" id="tooltip" role="tooltip"></div>

    <script>
      "use strict";

      const MODEL = __CODEBASE_MAP_MODEL__;
      const NS = "http://www.w3.org/2000/svg";
      const PALETTE = [
        "#688b7a",
        "#a86a4e",
        "#7b739d",
        "#a48b4d",
        "#557d94",
        "#936a75",
      ];
      const KINDS = new Set([
        "entry",
        "process",
        "state",
        "store",
        "external",
        "output",
      ]);
      const canvas = {
        width: Number(MODEL.canvas?.width) || 1200,
        height: Number(MODEL.canvas?.height) || 760,
      };

      const groups = MODEL.groups.map((group, index) => ({
        description: "",
        color: PALETTE[index % PALETTE.length],
        ...group,
      }));
      const groupById = new Map(groups.map((group) => [group.id, group]));
      const nodes = MODEL.nodes.map((node) => ({
        shortLabel: node.label
          .split(/\s+/)
          .map((part) => part[0])
          .join("")
          .slice(0, 3)
          .toUpperCase(),
        kind: "process",
        width: 190,
        height: 92,
        file: "",
        implementation: "",
        evidence: [],
        confidence: "observed",
        tags: [],
        ...node,
      }));
      const nodeById = new Map(nodes.map((node) => [node.id, node]));
      const flows = MODEL.flows.map((flow, index) => ({
        description: "",
        color: PALETTE[(index + 1) % PALETTE.length],
        ...flow,
      }));

      document.title = `${MODEL.title} · Codebase map`;
      document.getElementById("repository-name").textContent = MODEL.repository;
      document.getElementById("map-title").textContent = MODEL.title;
      document.getElementById("map-description").textContent = MODEL.summary;

      const derivedStats = [
        { label: "Boundaries", value: String(groups.length) },
        { label: "Components", value: String(nodes.length) },
        { label: "Flows", value: String(flows.length) },
        {
          label: "Evidence refs",
          value: String(
            nodes.reduce((sum, node) => sum + node.evidence.length, 0),
          ),
        },
      ];
      const stats = [...(MODEL.stats || []), ...derivedStats].slice(0, 4);
      stats.forEach((stat, index) => {
        document.getElementById(`stat-label-${index}`).textContent = stat.label;
        document.getElementById(`stat-value-${index}`).textContent = stat.value;
      });

      function svgElement(name, attributes = {}) {
        const element = document.createElementNS(NS, name);
        for (const [key, value] of Object.entries(attributes))
          element.setAttribute(key, String(value));
        return element;
      }

      function htmlElement(name, className, text) {
        const element = document.createElement(name);
        if (className) element.className = className;
        if (text !== undefined) element.textContent = text;
        return element;
      }

      function appendText(parent, className, text) {
        const paragraph = htmlElement("p", className, text);
        parent.append(paragraph);
        return paragraph;
      }

      const defs = document.getElementById("map-defs");
      flows.forEach((flow) => {
        const marker = svgElement("marker", {
          id: `arrow-${flow.id}`,
          viewBox: "0 0 10 10",
          refX: 9,
          refY: 5,
          markerWidth: 6,
          markerHeight: 6,
          orient: "auto-start-reverse",
        });
        marker.append(
          svgElement("path", { d: "M 0 0 L 10 5 L 0 10 z", fill: flow.color }),
        );
        defs.append(marker);
      });

      document
        .getElementById("grid-background")
        .setAttribute("width", canvas.width);
      document
        .getElementById("grid-background")
        .setAttribute("height", canvas.height);

      const groupsLayer = document.getElementById("groups-layer");
      const edgesLayer = document.getElementById("edges-layer");
      const nodesLayer = document.getElementById("nodes-layer");
      const particlesLayer = document.getElementById("particles-layer");
      const nodeElements = new Map();
      const edgeRecords = [];

      function groupBounds(groupId) {
        const members = nodes.filter((node) => node.group === groupId);
        const padding = 34;
        const minX = Math.min(...members.map((node) => node.x)) - padding;
        const minY = Math.min(...members.map((node) => node.y)) - padding - 14;
        const maxX =
          Math.max(...members.map((node) => node.x + node.width)) +
          padding +
          16;
        const maxY =
          Math.max(...members.map((node) => node.y + node.height)) +
          padding +
          18;
        return { x: minX, y: minY, width: maxX - minX, height: maxY - minY };
      }

      groups.forEach((group) => {
        const bounds = groupBounds(group.id);
        const rect = svgElement("rect", {
          ...bounds,
          rx: 3,
          class: "group-boundary",
          "data-group": group.id,
        });
        const label = svgElement("text", {
          x: bounds.x + 10,
          y: bounds.y + 17,
          class: "group-label",
        });
        label.textContent = group.label;
        groupsLayer.append(rect, label);
      });

      function edgePath(from, to) {
        const sx = from.x + from.width / 2;
        const sy = from.y + from.height / 2 + 8;
        const tx = to.x + to.width / 2;
        const ty = to.y + to.height / 2 + 8;
        const horizontal = Math.abs(tx - sx) >= Math.abs(ty - sy);
        if (horizontal) {
          const bend = (sx + tx) / 2;
          return `M ${sx} ${sy} C ${bend} ${sy}, ${bend} ${ty}, ${tx} ${ty}`;
        }
        const bend = (sy + ty) / 2;
        return `M ${sx} ${sy} C ${sx} ${bend}, ${tx} ${bend}, ${tx} ${ty}`;
      }

      flows.forEach((flow) => {
        flow.steps.forEach((step, stepIndex) => {
          const from = nodeById.get(step.from);
          const to = nodeById.get(step.to);
          const d = edgePath(from, to);
          const edgeGroup = svgElement("g", {
            class: "edge-group",
            "data-flow": flow.id,
          });
          const visible = svgElement("path", {
            id: `edge-${flow.id}-${stepIndex}`,
            d,
            class: "edge-visible",
            stroke: flow.color,
            "marker-end": `url(#arrow-${flow.id})`,
          });
          const hit = svgElement("path", {
            d,
            class: "edge-hit",
            tabindex: 0,
            role: "button",
          });
          const labelX = (from.x + from.width / 2 + to.x + to.width / 2) / 2;
          const labelY =
            (from.y + from.height / 2 + to.y + to.height / 2) / 2 - 8;
          const labelWidth = Math.min(
            190,
            Math.max(74, step.label.length * 6.2 + 16),
          );
          const labelBg = svgElement("rect", {
            x: labelX - labelWidth / 2,
            y: labelY - 12,
            width: labelWidth,
            height: 20,
            rx: 2,
            class: "edge-label-bg",
          });
          const label = svgElement("text", {
            x: labelX,
            y: labelY + 2,
            class: "edge-label",
            "text-anchor": "middle",
          });
          label.textContent = step.label;
          const record = {
            flow,
            step,
            stepIndex,
            path: visible,
            group: edgeGroup,
          };
          const select = () => selectItem("step", record);
          hit.addEventListener("click", select);
          hit.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") select();
          });
          edgeGroup.append(visible, hit, labelBg, label);
          edgesLayer.append(edgeGroup);
          edgeRecords.push(record);
        });
      });

      function splitLabel(label, maxLength = 20) {
        const words = label.split(/\s+/);
        const lines = [""];
        for (const word of words) {
          const current = lines[lines.length - 1];
          if (
            current &&
            `${current} ${word}`.length > maxLength &&
            lines.length < 2
          )
            lines.push(word);
          else lines[lines.length - 1] = current ? `${current} ${word}` : word;
        }
        return lines;
      }

      nodes.forEach((node) => {
        const group = groupById.get(node.group);
        const depth = 16;
        const element = svgElement("g", {
          class: "node",
          transform: `translate(${node.x} ${node.y})`,
          tabindex: 0,
          role: "button",
          "aria-label": `${node.label}: ${node.responsibility}`,
          style: `--node-color: ${group.color}`,
        });
        const top = svgElement("polygon", {
          points: `0,${depth} ${depth},0 ${node.width + depth},0 ${node.width},${depth}`,
          class: "top-face",
        });
        const side = svgElement("polygon", {
          points: `${node.width},${depth} ${node.width + depth},0 ${node.width + depth},${node.height} ${node.width},${node.height + depth}`,
          class: "side-face",
        });
        const front = svgElement("rect", {
          x: 0,
          y: depth,
          width: node.width,
          height: node.height,
          class: "front",
        });
        const kindBar = svgElement("rect", {
          x: 0,
          y: depth,
          width: 5,
          height: node.height,
          class: "kind-bar",
        });
        const short = svgElement("text", { x: 10, y: 12, class: "node-short" });
        short.textContent = node.shortLabel;
        const labels = splitLabel(node.label).map((line, index) => {
          const label = svgElement("text", {
            x: 14,
            y: depth + 27 + index * 16,
            class: "node-title",
          });
          label.textContent = line;
          return label;
        });
        const meta = svgElement("text", {
          x: 14,
          y: depth + node.height - 13,
          class: "node-meta",
        });
        const source = node.file
          ? node.file.split("/").slice(-2).join("/")
          : node.kind;
        meta.textContent = `${KINDS.has(node.kind) ? node.kind : "process"} · ${source}`;
        const select = () => selectItem("node", node);
        element.addEventListener("click", select);
        element.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            select();
          }
        });
        element.append(top, side, front, kindBar, short, ...labels, meta);
        nodesLayer.append(element);
        nodeElements.set(node.id, element);
      });

      const groupList = document.getElementById("group-list");
      groups.forEach((group) => {
        const button = htmlElement("button", "rail-item");
        button.type = "button";
        button.dataset.group = group.id;
        button.append(htmlElement("strong", "", group.label));
        button.append(
          htmlElement(
            "span",
            "",
            group.description ||
              `${nodes.filter((node) => node.group === group.id).length} components`,
          ),
        );
        button.addEventListener("click", () => {
          selectItem("group", group);
          focusBounds(groupBounds(group.id));
        });
        groupList.append(button);
      });

      const flowList = document.getElementById("flow-list");
      flows.forEach((flow) => {
        const button = htmlElement("button", "rail-item");
        button.type = "button";
        button.dataset.flow = flow.id;
        button.append(htmlElement("strong", "", flow.label));
        button.append(
          htmlElement(
            "span",
            "",
            flow.description || `${flow.steps.length} transitions`,
          ),
        );
        button.addEventListener("click", () => selectItem("flow", flow));
        flowList.append(button);
      });

      let currentTab = "what";
      let selection = { type: "overview", data: MODEL };
      const inspectorBody = document.getElementById("inspector-body");

      document.querySelectorAll(".inspector-tabs button").forEach((button) => {
        button.addEventListener("click", () => {
          currentTab = button.dataset.tab;
          document
            .querySelectorAll(".inspector-tabs button")
            .forEach((candidate) =>
              candidate.classList.toggle("active", candidate === button),
            );
          renderInspector();
        });
      });

      function section(parent, title, content) {
        if (!content || (Array.isArray(content) && content.length === 0))
          return;
        const wrapper = htmlElement("section", "detail-section");
        wrapper.append(htmlElement("h3", "", title));
        if (Array.isArray(content)) {
          const list = htmlElement("ul");
          content.forEach((item) => list.append(htmlElement("li", "", item)));
          wrapper.append(list);
        } else {
          appendText(wrapper, "", content);
        }
        parent.append(wrapper);
      }

      function inspectorHeader(kicker, title, subtitle = "") {
        inspectorBody.replaceChildren();
        inspectorBody.append(htmlElement("div", "inspector-kicker", kicker));
        inspectorBody.append(htmlElement("h1", "inspector-title", title));
        if (subtitle)
          inspectorBody.append(
            htmlElement("p", "inspector-subtitle", subtitle),
          );
      }

      function renderSources(node) {
        const refs = [...node.evidence];
        const primary = node.file
          ? `${node.file}${node.line ? `:${node.line}` : ""}`
          : "";
        if (primary && !refs.includes(primary)) refs.unshift(primary);
        if (refs.length === 0) return;
        const wrapper = htmlElement("section", "detail-section");
        wrapper.append(htmlElement("h3", "", "Source evidence"));
        refs.forEach((ref) => {
          const button = htmlElement("button", "source-ref", ref);
          button.type = "button";
          button.title = "Copy source reference";
          button.addEventListener("click", async () => {
            await navigator.clipboard?.writeText(ref);
            const previous = button.textContent;
            button.textContent = `Copied · ${ref}`;
            setTimeout(() => {
              button.textContent = previous;
            }, 1000);
          });
          wrapper.append(button);
        });
        inspectorBody.append(wrapper);
      }

      function renderInspector() {
        const { type, data } = selection;
        if (type === "overview") {
          inspectorHeader(
            MODEL.repository,
            MODEL.title,
            MODEL.subtitle || MODEL.question || "Interactive repository map",
          );
          section(
            inspectorBody,
            currentTab === "what" ? "What this map answers" : "Model scope",
            currentTab === "what"
              ? MODEL.summary
              : MODEL.question || MODEL.summary,
          );
          section(inspectorBody, "Known omissions", MODEL.notes || []);
          return;
        }
        if (type === "node") {
          const group = groupById.get(data.group);
          inspectorHeader(
            `${group.label} · ${data.kind}`,
            data.label,
            data.file
              ? `${data.file}${data.line ? `:${data.line}` : ""}`
              : group.description,
          );
          if (currentTab === "what") {
            section(inspectorBody, "Responsibility", data.responsibility);
            section(inspectorBody, "Boundary", group.description);
            if (data.tags.length) {
              const wrapper = htmlElement("section", "detail-section");
              wrapper.append(htmlElement("h3", "", "Tags"));
              const pills = htmlElement("div", "pill-row");
              data.tags.forEach((tag) =>
                pills.append(htmlElement("span", "pill", tag)),
              );
              wrapper.append(pills);
              inspectorBody.append(wrapper);
            }
          } else {
            section(
              inspectorBody,
              "Implementation",
              data.implementation ||
                "Implementation detail was not included in this map.",
            );
            section(inspectorBody, "Confidence", data.confidence);
            renderSources(data);
          }
          return;
        }
        if (type === "group") {
          const members = nodes.filter((node) => node.group === data.id);
          inspectorHeader(
            "System boundary",
            data.label,
            `${members.length} mapped components`,
          );
          section(
            inspectorBody,
            currentTab === "what" ? "Ownership" : "Included components",
            currentTab === "what"
              ? data.description
              : members.map(
                  (node) => `${node.label} — ${node.file || node.kind}`,
                ),
          );
          return;
        }
        if (type === "flow") {
          inspectorHeader(
            "Runtime flow",
            data.label,
            `${data.steps.length} directed transitions`,
          );
          section(inspectorBody, "Purpose", data.description);
          section(
            inspectorBody,
            currentTab === "what" ? "Payload sequence" : "Implementation path",
            data.steps.map((step) =>
              currentTab === "what"
                ? `${step.label}: ${step.payload}`
                : `${nodeById.get(step.from).label} → ${nodeById.get(step.to).label}`,
            ),
          );
          return;
        }
        if (type === "step") {
          const { flow, step } = data;
          const from = nodeById.get(step.from);
          const to = nodeById.get(step.to);
          inspectorHeader(
            `${flow.label} · transition`,
            step.label,
            `${from.label} → ${to.label}`,
          );
          if (currentTab === "what") {
            const payload = htmlElement("div", "payload", step.payload);
            const wrapper = htmlElement("section", "detail-section");
            wrapper.append(htmlElement("h3", "", "Moving payload"), payload);
            inspectorBody.append(wrapper);
            section(
              inspectorBody,
              "Meaning",
              step.description || flow.description,
            );
          } else {
            section(
              inspectorBody,
              "Source component",
              `${from.label} — ${from.file || from.kind}`,
            );
            section(
              inspectorBody,
              "Destination component",
              `${to.label} — ${to.file || to.kind}`,
            );
            section(inspectorBody, "Evidence", [
              ...from.evidence,
              ...to.evidence,
            ]);
          }
        }
      }

      function selectItem(type, data) {
        selection = { type, data };
        nodeElements.forEach((element, id) =>
          element.classList.toggle(
            "selected",
            type === "node" && data.id === id,
          ),
        );
        edgeRecords.forEach((record) =>
          record.group.classList.toggle(
            "selected",
            (type === "step" && record === data) ||
              (type === "flow" && record.flow.id === data.id),
          ),
        );
        document.querySelectorAll(".rail-item").forEach((button) => {
          button.classList.toggle(
            "active",
            (type === "group" && button.dataset.group === data.id) ||
              (type === "flow" && button.dataset.flow === data.id),
          );
        });
        renderInspector();
      }

      const tooltip = document.getElementById("tooltip");
      function showTooltip(event, text) {
        tooltip.textContent = text;
        tooltip.style.left = `${event.clientX}px`;
        tooltip.style.top = `${event.clientY}px`;
        tooltip.classList.add("visible");
      }
      function hideTooltip() {
        tooltip.classList.remove("visible");
      }

      const particleRecords = [];
      edgeRecords.forEach((record, edgeIndex) => {
        for (let index = 0; index < 2; index += 1) {
          const particle = svgElement("circle", {
            r: index === 0 ? 5 : 3.6,
            fill: record.flow.color,
            class: "particle",
          });
          particle.addEventListener("pointermove", (event) =>
            showTooltip(event, `${record.step.label} · ${record.step.payload}`),
          );
          particle.addEventListener("pointerleave", hideTooltip);
          particle.addEventListener("click", () => selectItem("step", record));
          particlesLayer.append(particle);
          particleRecords.push({
            particle,
            record,
            offset: (edgeIndex * 0.17 + index * 0.48) % 1,
          });
        }
      });

      let paused = window.matchMedia(
        "(prefers-reduced-motion: reduce)",
      ).matches;
      let animationProgress = 0;
      let previousTime = performance.now();

      function drawParticles(progress) {
        particleRecords.forEach(({ particle, record, offset }) => {
          const path = record.path;
          const length = path.getTotalLength();
          const local = (progress + offset) % 1;
          const point = path.getPointAtLength(length * local);
          particle.setAttribute("cx", point.x);
          particle.setAttribute("cy", point.y);
        });
      }

      function animate(now) {
        const elapsed = Math.min(50, now - previousTime);
        previousTime = now;
        if (!paused)
          animationProgress = (animationProgress + elapsed / 6200) % 1;
        drawParticles(animationProgress);
        requestAnimationFrame(animate);
      }
      requestAnimationFrame(animate);

      const playButton = document.getElementById("play-button");
      function updatePlayButton() {
        playButton.textContent = paused ? "▶ Resume flow" : "❚❚ Pause flow";
      }
      updatePlayButton();
      playButton.addEventListener("click", () => {
        paused = !paused;
        updatePlayButton();
      });
      document.getElementById("step-button").addEventListener("click", () => {
        paused = true;
        animationProgress = (animationProgress + 0.08) % 1;
        updatePlayButton();
        drawParticles(animationProgress);
      });

      const map = document.getElementById("map");
      let view = { x: 0, y: 0, width: canvas.width, height: canvas.height };
      let drag = null;

      function applyView() {
        map.setAttribute(
          "viewBox",
          `${view.x} ${view.y} ${view.width} ${view.height}`,
        );
      }
      applyView();

      function zoom(
        factor,
        centerX = view.x + view.width / 2,
        centerY = view.y + view.height / 2,
      ) {
        const nextWidth = Math.max(
          260,
          Math.min(canvas.width * 2, view.width * factor),
        );
        const nextHeight = nextWidth * (view.height / view.width);
        const ratioX = (centerX - view.x) / view.width;
        const ratioY = (centerY - view.y) / view.height;
        view = {
          x: centerX - nextWidth * ratioX,
          y: centerY - nextHeight * ratioY,
          width: nextWidth,
          height: nextHeight,
        };
        applyView();
      }

      function focusBounds(bounds) {
        const margin = 55;
        const width = Math.max(320, bounds.width + margin * 2);
        const height = Math.max(240, bounds.height + margin * 2);
        const stageRatio = map.clientWidth / Math.max(1, map.clientHeight);
        const boundsRatio = width / height;
        const targetWidth =
          boundsRatio > stageRatio ? width : height * stageRatio;
        const targetHeight = targetWidth / stageRatio;
        view = {
          x: bounds.x + bounds.width / 2 - targetWidth / 2,
          y: bounds.y + bounds.height / 2 - targetHeight / 2,
          width: targetWidth,
          height: targetHeight,
        };
        applyView();
      }

      function resetView() {
        view = { x: 0, y: 0, width: canvas.width, height: canvas.height };
        applyView();
        selectItem("overview", MODEL);
      }

      map.addEventListener(
        "wheel",
        (event) => {
          event.preventDefault();
          const rect = map.getBoundingClientRect();
          const x =
            view.x + ((event.clientX - rect.left) / rect.width) * view.width;
          const y =
            view.y + ((event.clientY - rect.top) / rect.height) * view.height;
          zoom(event.deltaY > 0 ? 1.12 : 0.89, x, y);
        },
        { passive: false },
      );

      map.addEventListener("pointerdown", (event) => {
        if (event.target.closest?.(".node, .edge-hit, .particle")) return;
        drag = {
          x: event.clientX,
          y: event.clientY,
          viewX: view.x,
          viewY: view.y,
        };
        map.setPointerCapture(event.pointerId);
        map.classList.add("dragging");
      });
      map.addEventListener("pointermove", (event) => {
        if (!drag) return;
        const rect = map.getBoundingClientRect();
        view.x =
          drag.viewX - ((event.clientX - drag.x) / rect.width) * view.width;
        view.y =
          drag.viewY - ((event.clientY - drag.y) / rect.height) * view.height;
        applyView();
      });
      map.addEventListener("pointerup", () => {
        drag = null;
        map.classList.remove("dragging");
      });

      document
        .getElementById("zoom-in")
        .addEventListener("click", () => zoom(0.82));
      document
        .getElementById("zoom-out")
        .addEventListener("click", () => zoom(1.2));
      document
        .getElementById("reset-button")
        .addEventListener("click", resetView);

      renderInspector();
    </script>
  </body>
</html>
